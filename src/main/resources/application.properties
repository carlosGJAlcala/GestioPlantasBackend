spring.application.name=huertojpa
# DATASOURCE: PostgreSQL de la Raspberry (192.168.1.33). El driver se deduce de la URL, asi que
# DB_URL=jdbc:mysql://... sigue funcionando para la BD antigua (poner entonces DB_MIGRAR=false y DB_VALIDAR=none).
spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.1.33:5432/huertodb}
spring.datasource.username=${DB_USER:huerto}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Esquema versionado con Flyway (db/migration/postgresql). Se aplica solo al arrancar.
spring.flyway.enabled=${DB_MIGRAR:true}
spring.flyway.locations=classpath:db/migration/postgresql
# Hibernate comprueba al arrancar que las entidades coinciden con las tablas (no las modifica).
spring.jpa.hibernate.ddl-auto=${DB_VALIDAR:validate}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:huertouah@gmail.com}
# S1: la contrasena de aplicacion de Gmail ya no va en el repo (REVOCAR la antigua, sigue en el historial de git)
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Table names physically
spring.jpa.hibernate.naming.physicalstrategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Seguridad (S1/S3). Valores reales por variables de entorno; ver .env.example ---
# Clave HS256 en Base64 (>= 32 bytes): openssl rand -base64 48. Vacia => clave aleatoria en cada arranque.
jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
# Clave del ESP32 (cabecera X-Device-Key). Vacia => endpoints /auth/** abiertos (modo compatibilidad, con aviso en el log).
device.api-key=${DEVICE_API_KEY:}
# Origenes permitidos para CORS, separados por comas (p.ej. http://localhost:3000,https://mi-front.azurewebsites.net)
cors.allowed-origins=${CORS_ORIGINS:*}
# S2: contraseñas con BCrypt. Coste 10 = 2^10 vueltas. Al arrancar se convierten las que sigan en SHA-256 sin sal.
contrasenas.bcrypt-coste=${CONTRASENAS_COSTE:10}
contrasenas.migrar=${CONTRASENAS_MIGRAR:true}
# S8b: plazo para entrar con la contraseña temporal que pone el admin y cambiarla (ISO-8601: P3D = 3 días, PT12H...).
# Pasado el plazo no sirve para entrar y hay que pedir otra.
contrasenas.temporal-validez=${CONTRASENA_TEMPORAL_VALIDEZ:P3D}

# --- Alertas de las macetas (paquete alertas) ---
# Revisión periódica: placa sin conexión, riego fallido, tierra seca, exceso de agua, temperatura fuera de rango.
alertas.activas=${ALERTAS_ACTIVAS:true}
alertas.intervalo=${ALERTAS_INTERVALO:PT5M}
# Los avisos (no críticos) solo se mandan por correo si el problema dura al menos esto.
alertas.espera-aviso=${ALERTAS_ESPERA_AVISO:PT30M}
# Una alerta se cierra cuando lleva esto sin verse (evita abrir/cerrar si la humedad baila en el umbral).
alertas.espera-cierre=${ALERTAS_ESPERA_CIERRE:PT30M}

# --- S6: límite de intentos de login (en memoria, se olvida al reiniciar) ---
# N fallos seguidos del mismo usuario desde la misma IP (o M desde la misma IP con cualquier usuario) dentro de la
# ventana => bloqueo. El bloqueo se duplica si se repite sin un login correcto (máximo 24 h).
login.intentos-maximos=${LOGIN_INTENTOS:5}
login.intentos-maximos-ip=${LOGIN_INTENTOS_IP:20}
login.ventana=${LOGIN_VENTANA:PT15M}
login.bloqueo=${LOGIN_BLOQUEO:PT15M}
# Detrás del nginx de la Raspberry: la IP del cliente sale de X-Forwarded-For (solo se fía de proxies de red
# interna: 10.x, 172.16-31.x, 192.168.x, 127.x). Sin esto, todos los intentos vendrían de la IP del contenedor nginx.
server.forward-headers-strategy=${FORWARD_HEADERS:native}
